name: Build FacebookReactionHelper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: 'platform-tools'

      - name: Install Android SDK Components
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Find Android ZIP
        run: |
          echo "Searching for Android ZIP..."
          find . -maxdepth 3 -type f -iname "*.zip" -print

      - name: Extract Android Project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 3 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: Android ZIP file not found."
            exit 1
          fi

          echo "Using ZIP:"
          echo "$ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo "===== EXTRACTED FILES ====="
          find android_project -maxdepth 6 -type f | sort
          echo "==========================="

      - name: Locate Android Project
        run: |
          set -e

          SETTINGS=$(find android_project -type f \
            \( -name "settings.gradle" -o -name "settings.gradle.kts" \) \
            | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt

      - name: Verify Android Project
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          echo "===== PROJECT STRUCTURE ====="
          find "$PROJECT_DIR" -maxdepth 6 -type f | sort
          echo "============================="

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build Debug APK
        run: |
          set -e

          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          echo "===== GRADLE VERSION ====="
          gradle --version

          echo "===== BUILDING APK ====="

          gradle clean assembleDebug \
            --stacktrace \
            --no-daemon

      - name: Find Generated APK
        if: success()
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          echo "===== GENERATED APK ====="

          find "$PROJECT_DIR" \
            -type f \
            -name "*.apk" \
            -print

          echo "========================="

      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FacebookReactionHelper-APK
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      - name: Collect Build Error Information
        if: failure()
        run: |
          mkdir -p build-error-report

          echo "FacebookReactionHelper build failed." \
            > build-error-report/README.txt

          echo "" >> build-error-report/README.txt

          echo "Project files:" \
            >> build-error-report/README.txt

          find android_project \
            -maxdepth 8 \
            -type f \
            >> build-error-report/README.txt || true

      - name: Upload Build Error Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FacebookReactionHelper-Build-Error
          path: build-error-report/
          if-no-files-found: warn
