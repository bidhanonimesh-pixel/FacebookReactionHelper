name: Build FacebookReactionHelper APK

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build Android APK
    runs-on: ubuntu-latest

    steps:
      # 1. Repository download
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 3. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      # 4. Install required Android SDK
      - name: Install Android SDK
        run: |
          yes | sdkmanager --licenses || true
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-35"
          sdkmanager "build-tools;35.0.0"

      # 5. Find uploaded ZIP
      - name: Find Android ZIP
        run: |
          echo "Searching for Android project ZIP..."
          find . -maxdepth 2 -type f -iname "*.zip" -print

      # 6. Extract ZIP
      - name: Extract Android Project
        run: |
          set -e

          ZIP_FILE=$(find . -maxdepth 2 -type f -iname "*.zip" | head -n 1)

          if [ -z "$ZIP_FILE" ]; then
            echo "ERROR: No ZIP file found."
            exit 1
          fi

          echo "Using ZIP: $ZIP_FILE"

          rm -rf android_project
          mkdir -p android_project

          unzip -q "$ZIP_FILE" -d android_project

          echo "===== Extracted files ====="
          find android_project -maxdepth 4 -type f | sort
          echo "==========================="

      # 7. Locate actual Android project
      - name: Locate Gradle Project
        run: |
          set -e

          echo "Searching for settings.gradle..."

          SETTINGS=$(find android_project -type f \( \
            -name "settings.gradle" -o \
            -name "settings.gradle.kts" \
          \) | head -n 1)

          if [ -z "$SETTINGS" ]; then
            echo "ERROR: settings.gradle not found."
            echo "The ZIP does not contain a valid Gradle Android project."
            exit 1
          fi

          PROJECT_DIR=$(dirname "$SETTINGS")

          echo "Android project found at:"
          echo "$PROJECT_DIR"

          echo "$PROJECT_DIR" > project_path.txt

      # 8. Show project structure
      - name: Verify Android Project
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          echo "===== Android Project ====="
          find "$PROJECT_DIR" -maxdepth 4 -type f | sort
          echo "==========================="

      # 9. Make Gradle wrapper executable
      - name: Prepare Gradle Wrapper
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          if [ -f "$PROJECT_DIR/gradlew" ]; then
            chmod +x "$PROJECT_DIR/gradlew"
            echo "Gradle wrapper found."
          else
            echo "ERROR: gradlew not found."
            exit 1
          fi

      # 10. Build APK
      - name: Build Debug APK
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          cd "$PROJECT_DIR"

          ./gradlew clean assembleDebug \
            --stacktrace \
            --no-daemon

      # 11. Find APK
      - name: Find Generated APK
        if: success()
        run: |
          PROJECT_DIR=$(cat project_path.txt)

          echo "===== GENERATED APK ====="
          find "$PROJECT_DIR" -type f -name "*.apk" -print
          echo "========================"

      # 12. Upload APK
      - name: Upload APK
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: FacebookReactionHelper-APK
          path: |
            android_project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error

      # 13. Upload build reports if build fails
      - name: Collect Build Error Logs
        if: failure()
        run: |
          mkdir -p build-error-report

          PROJECT_DIR=""

          if [ -f project_path.txt ]; then
            PROJECT_DIR=$(cat project_path.txt)
          fi

          echo "===== PROJECT PATH =====" \
            > build-error-report/summary.txt

          echo "$PROJECT_DIR" \
            >> build-error-report/summary.txt

          echo "" >> build-error-report/summary.txt
          echo "===== PROJECT FILES =====" \
            >> build-error-report/summary.txt

          find android_project -maxdepth 6 -type f \
            >> build-error-report/summary.txt || true

      # 14. Upload error information
      - name: Upload Build Error Report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: FacebookReactionHelper-Build-Error
          path: build-error-report/
          if-no-files-found: warn
